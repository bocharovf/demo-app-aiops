# Namespace-scoped deploy account for minishop CI.
# The deployer can manage everything inside `minishop` but cannot see or
# touch any other namespace (Role, not ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: minishop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: minishop
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: minishop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: minishop
