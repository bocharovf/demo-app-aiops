apiVersion: batch/v1
kind: CronJob
metadata:
  name: inventory-sync
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: inventory-sync
              image: inventory-sync:local
              envFrom:
                - configMapRef:
                    name: inventory-sync-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: inventory-sync-db-secret
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
