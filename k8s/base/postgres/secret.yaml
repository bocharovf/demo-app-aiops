# Demo-only credentials for a disposable AIOps testing cluster.
# Not meant to protect anything of value - rotate freely, do not reuse elsewhere.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
